<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>OncoConnect</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages - SPA redirect
      // When GitHub Pages returns a 404 for a client-side route, this script
      // encodes the path into the query string and redirects to index.html.
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
